name: Deploy

on:
  workflow_dispatch:
    inputs:
      bootstrap_admin:
        description: "Include one-time ADMIN_BOOTSTRAP_LOGIN and ADMIN_BOOTSTRAP_PASSWORD from secrets (first deploy only)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to VDS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate required deployment configuration
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BOOTSTRAP_ADMIN: ${{ inputs.bootstrap_admin == true && 'true' || 'false' }}
          ADMIN_BOOTSTRAP_LOGIN: ${{ secrets.ADMIN_BOOTSTRAP_LOGIN }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          missing=0
          for name in DOMAIN DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production variable or secret: ${name}"
              missing=1
            fi
          done

          if [ "${BOOTSTRAP_ADMIN}" = "true" ]; then
            for name in ADMIN_BOOTSTRAP_LOGIN ADMIN_BOOTSTRAP_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::bootstrap_admin=true requires secret: ${name}"
                missing=1
              fi
            done
          fi

          exit "${missing}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${OWNER_LOWER}/" >> "$GITHUB_OUTPUT"

      - name: Build and push production Docker images
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_PREFIX: ${{ steps.meta.outputs.prefix }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_WRITE_TOKEN }}
        run: |
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}"

          docker buildx build \
            --push \
            --cache-from type=gha,scope=api \
            --cache-to type=gha,mode=max,scope=api \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            -f infra/docker/api.Dockerfile \
            -t "${IMAGE_PREFIX}pinveria-api:${IMAGE_TAG}" \
            .

          docker buildx build \
            --push \
            --secret id=nx_cloud_token,env=NX_CLOUD_ACCESS_TOKEN \
            --cache-from type=gha,scope=frontend \
            --cache-to type=gha,mode=max,scope=frontend \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --target web \
            -f infra/docker/frontend.Dockerfile \
            -t "${IMAGE_PREFIX}pinveria-web:${IMAGE_TAG}" \
            .

          docker buildx build \
            --push \
            --secret id=nx_cloud_token,env=NX_CLOUD_ACCESS_TOKEN \
            --cache-from type=gha,scope=frontend \
            --cache-to type=gha,mode=max,scope=frontend \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --target caddy \
            -f infra/docker/frontend.Dockerfile \
            -t "${IMAGE_PREFIX}pinveria-caddy:${IMAGE_TAG}" \
            .

      - name: Configure SSH client
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Deploy images and compose configuration to VDS
        timeout-minutes: 15
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          IMAGE_PREFIX: ${{ steps.meta.outputs.prefix }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOMAIN: ${{ vars.DOMAIN }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'pinveria' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'pinveria' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BOOTSTRAP_ADMIN: ${{ inputs.bootstrap_admin == true && 'true' || 'false' }}
          ADMIN_BOOTSTRAP_LOGIN: ${{ secrets.ADMIN_BOOTSTRAP_LOGIN }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          USER_NAME="${DEPLOY_USER:-deploy}"
          REMOTE="${USER_NAME}@${DEPLOY_HOST}"
          COMMON_SSH_OPTS="-i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          SSH_OPTS="${COMMON_SSH_OPTS} -p ${PORT}"
          SCP_OPTS="${COMMON_SSH_OPTS} -P ${PORT}"

          scp ${SCP_OPTS} compose.yml "${REMOTE}:/opt/pinveria/compose.yml"

          {
            printf 'DOMAIN=%s\n' "${DOMAIN}"
            printf 'IMAGE_PREFIX=%s\n' "${IMAGE_PREFIX}"
            printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}"
            printf 'POSTGRES_DB=%s\n' "${POSTGRES_DB}"
            printf 'POSTGRES_USER=%s\n' "${POSTGRES_USER}"
            printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD}"
            if [ "${BOOTSTRAP_ADMIN}" = "true" ]; then
              printf 'ADMIN_BOOTSTRAP_LOGIN=%s\n' "${ADMIN_BOOTSTRAP_LOGIN}"
              printf 'ADMIN_BOOTSTRAP_PASSWORD=%s\n' "${ADMIN_BOOTSTRAP_PASSWORD}"
            else
              printf 'ADMIN_BOOTSTRAP_LOGIN=\n'
              printf 'ADMIN_BOOTSTRAP_PASSWORD=\n'
            fi
          } | ssh ${SSH_OPTS} "${REMOTE}" "umask 077 && cat > /opt/pinveria/.env"

          printf '%s' "${GHCR_TOKEN}" | ssh ${SSH_OPTS} "${REMOTE}" "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"

          ssh ${SSH_OPTS} "${REMOTE}" "
            set -euo pipefail
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            cd /opt/pinveria
            docker compose pull
            docker compose up -d --remove-orphans
            if [ '${BOOTSTRAP_ADMIN}' = 'true' ]; then
              sed -i 's/^ADMIN_BOOTSTRAP_LOGIN=.*/ADMIN_BOOTSTRAP_LOGIN=/; s/^ADMIN_BOOTSTRAP_PASSWORD=.*/ADMIN_BOOTSTRAP_PASSWORD=/' /opt/pinveria/.env
            fi
            docker image prune -f
          "
