<h2 class="text-lg font-semibold">{{ context.style ? 'Edit style' : 'Add style' }}</h2>

<form class="mt-5 gap-4 flex flex-col" [formRoot]="fields">
	<ui-field label="Style name">
		<input id="style-name" hlmInput [formField]="fields.name" autocomplete="off" />
	</ui-field>
	<ui-field label="Background color" description="Shown behind transparent tiles. Does not change the image.">
		<ui-color-picker id="style-color" [formField]="fields.backgroundColor" />
	</ui-field>

	@if (!context.style) {
		<ui-field label="Source image" description="JPEG, PNG, WebP or AVIF at any supported resolution.">
			<input type="hidden" [formField]="fields.sourceAssetId" />

			@if (source(); as image) {
				<ui-media-thumbnail class="h-32 rounded-md w-full border" [image]="image" sizes="400px" />
				<p class="text-sm truncate">{{ image.name }}</p>
			}

			<button
				id="style-source"
				ui-button
				type="button"
				variant="outline"
				[disabled]="fields().submitting()"
				(click)="chooseImage()"
			>
				Choose library image
			</button>
		</ui-field>
	}

	@if (error()) {
		<hlm-field-error forceShow>{{ error() }}</hlm-field-error>
	}

	<div class="gap-2 flex justify-end">
		<button ui-button type="button" variant="outline" [disabled]="fields().submitting()" (click)="dialog.close()">
			Cancel
		</button>
		<button
			ui-button
			[attr.aria-label]="context.style ? 'Save changes' : 'Add style'"
			[loading]="fields().submitting()"
			[disabled]="!!context.style && !fields().dirty()"
		>
			{{ context.style ? 'Save changes' : 'Add style' }}
		</button>
	</div>
</form>
