<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<meta id="theme-color-light" name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta id="theme-color-dark" name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
		<title>Pinveria</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
	</head>
	<body>
		<script>
			try {
				if (!/(?:^|;\s*)pinveria\.theme=/.test(document.cookie)) {
					const theme = localStorage.getItem('pinveria.theme')

					if (theme === 'light' || theme === 'dark') {
						document.querySelector('meta[name="color-scheme"]').content = theme

						for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
							meta.media = meta.id === `theme-color-${theme}` ? 'all' : 'not all'
						}
					}
				}
			} catch {}
		</script>
		<app-root></app-root>
	</body>
</html>
