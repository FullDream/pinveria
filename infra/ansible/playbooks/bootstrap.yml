---
- name: Bootstrap and harden Pinveria VDS
  hosts: all
  become: true
  vars:
    deploy_user: "{{ lookup('env', 'DEPLOY_USER') | default('deploy', true) }}"
    deploy_ssh_public_key: "{{ lookup('env', 'DEPLOY_SSH_PUBLIC_KEY') }}"
    ssh_port: "{{ lookup('env', 'DEPLOY_PORT') | default('22', true) }}"
    app_dir: /opt/pinveria
    swap_file_path: /swapfile
    swap_size_mb: 2048

  tasks:
    - name: Require deploy SSH public key
      ansible.builtin.assert:
        that:
          - deploy_ssh_public_key | length > 0
        fail_msg: "Set DEPLOY_SSH_PUBLIC_KEY environment variable before running bootstrap."

    - name: Update apt cache and install base security & helper packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - fail2ban
          - unattended-upgrades
          - zstd
        state: present

    - name: Ensure deploy user exists with Docker and sudo access
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true
        state: present

    - name: Install authorized SSH public key for deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        state: present
        key: "{{ deploy_ssh_public_key }}"

    - name: Allow passwordless sudo for deploy user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ deploy_user }}"
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Harden SSH daemon configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
        validate: "sshd -t -f %s"
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?KbdInteractiveAuthentication', line: 'KbdInteractiveAuthentication no' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
      notify: Restart sshd

    - name: Create swap file if missing
      ansible.builtin.command:
        cmd: "fallocate -l {{ swap_size_mb }}M {{ swap_file_path }}"
        creates: "{{ swap_file_path }}"
      register: swap_created

    - name: Set swap file permissions
      ansible.builtin.file:
        path: "{{ swap_file_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format and enable swap file when newly created
      ansible.builtin.shell: |
        mkswap {{ swap_file_path }}
        swapon {{ swap_file_path }}
      when: swap_created.changed

    - name: Persist swap file in /etc/fstab
      ansible.builtin.mount:
        name: none
        src: "{{ swap_file_path }}"
        fstype: swap
        opts: sw
        passno: 0
        dump: 0
        state: present

    - name: Install official Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker official apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine and Docker Compose plugin
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Configure Docker daemon log rotation
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "5"
            },
            "live-restore": true
          }
      notify: Restart docker

    - name: Configure UFW firewall defaults
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Allow SSH, HTTP, and HTTPS in UFW
      community.general.ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { rule: limit, port: "{{ ssh_port }}", proto: tcp }
        - { rule: allow, port: "80", proto: tcp }
        - { rule: allow, port: "443", proto: tcp }
        - { rule: allow, port: "443", proto: udp }

    - name: Enable UFW firewall
      community.general.ufw:
        state: enabled

    - name: Enable and start fail2ban and docker services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - fail2ban
        - docker

    - name: Create Pinveria application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0750"

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: ssh
        state: restarted

    - name: Restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
